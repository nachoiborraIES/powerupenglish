<header class="site-header">
  <div class="header-container">
    <div class="header-left">
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" aria-label="Abrir menú / Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="{{ '/' | relative_url }}" class="brand-logo" title="PowerUpEnglish Home">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <span>PowerUp<span class="accent">English</span></span>
      </a>
    </div>

    <div class="header-right">
      <!-- CEFR Level Navigation (A1 to C2) -->
      <nav class="level-nav" aria-label="CEFR Levels">
        <ul class="level-nav-list">
          <li><a href="{{ '/a1/who-am-i.html' | relative_url }}" class="level-nav-link {% if page.level == 'a1' %}active{% endif %}" data-level="a1" title="Level A1">A1</a></li>
          <li><a href="{{ '/a2/descriptions.html' | relative_url }}" class="level-nav-link {% if page.level == 'a2' %}active{% endif %}" data-level="a2" title="Level A2">A2</a></li>
          <li><a href="{{ '/b1/jobs.html' | relative_url }}" class="level-nav-link {% if page.level == 'b1' %}active{% endif %}" data-level="b1" title="Level B1">B1</a></li>
          <li><a href="{{ '/b2/science-and-technology.html' | relative_url }}" class="level-nav-link {% if page.level == 'b2' %}active{% endif %}" data-level="b2" title="Level B2">B2</a></li>
          <li><a href="{{ '/c1/politics-and-diplomacy.html' | relative_url }}" class="level-nav-link {% if page.level == 'c1' %}active{% endif %}" data-level="c1" title="Level C1">C1</a></li>
          <li><a href="{{ '/c2/close-synonyms.html' | relative_url }}" class="level-nav-link {% if page.level == 'c2' %}active{% endif %}" data-level="c2" title="Level C2">C2</a></li>
        </ul>
      </nav>

      <!-- Completion Button (Visible when studying a topic) -->
      {% if page.level %}
      <button id="header-complete-btn" class="header-complete-btn topic-complete-toggle-btn" type="button" data-topic-url="{{ page.url }}" aria-pressed="false" title="Marcar como superada / Mark as completed">
        <span class="complete-btn-icon" aria-hidden="true">
          <svg class="icon-circle" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
          </svg>
          <svg class="icon-checked" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </span>
        <span class="header-complete-text">
          <span class="state-uncompleted">
            <span class="lang-en">Done?</span>
            <span class="lang-es">¿Superada?</span>
          </span>
          <span class="state-completed">
            <span class="lang-en">Done ✓</span>
            <span class="lang-es">Superada ✓</span>
          </span>
        </span>
      </button>
      {% endif %}

      <!-- Language Swap Button (Always Visible) -->
      <button id="header-lang-swap-btn" class="lang-swap-btn" aria-label="Cambiar idioma / Swap language" title="Cambiar idioma / Switch language">
        <span class="lang-en"><strong style="color: var(--primary);">EN</strong> - ES</span>
        <span class="lang-es">EN - <strong style="color: var(--primary);">ES</strong></span>
      </button>
    </div>
  </div>
</header>
