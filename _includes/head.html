<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
{% if page.title_en %}<meta name="title-en" content="{{ page.title_en }}">{% endif %}
{% if page.title_es %}<meta name="title-es" content="{{ page.title_es }}">{% endif %}
<meta name="description" content="{{ page.description | default: site.description }}">

<!-- Anti-FOUC Language Init Script -->
<script>
  (function() {
    var lang = localStorage.getItem('powerup_lang') || 'en';
    document.documentElement.setAttribute('data-lang', lang);
  })();
</script>

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
